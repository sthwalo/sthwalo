# Reproduces the cPanel layout: the SPA at the document root, the Node app
# mounted at /api on the same origin.
#
# Same origin is the part worth testing. src/utils/adminApi.ts claims the site
# and API are "different origins in production" — they are not, and with
# SameSite=Strict a genuinely cross-origin session cookie would be refused by
# the browser outright. Serving both from one host here settles it.

Listen 443

<Directory "/usr/local/apache2/htdocs">
    Options FollowSymLinks
    # The whole reason for using Apache: honour the repo's own .htaccess
    # instead of reimplementing its rules and testing the reimplementation.
    AllowOverride All
    Require all granted
</Directory>

# ProxyPass resolves during URL translation, before .htaccess rewrites run, so
# /api never reaches the SPA fallback. The `RewriteRule ^api(/|$) - [L]` line in
# .htaccess is still what protects it on cPanel, where Passenger does this job.
#
# PREFIX TEST: production runs under Passenger, which may or may not strip the
# /api base URI before Express sees it. The app registers both '/posts' and
# '/api/posts' to cover either case. To prove that dual registration earns its
# keep, change the two lines below to drop the trailing /api:
#     ProxyPass        /api http://api:4000
#     ProxyPassReverse /api http://api:4000
# then rebuild and re-run the checks. Everything should still pass.
ProxyPreserveHost On
ProxyPass        /api http://api:4000/api
ProxyPassReverse /api http://api:4000/api

<VirtualHost *:443>
    DocumentRoot "/usr/local/apache2/htdocs"

    SSLEngine on
    SSLCertificateFile    "/usr/local/apache2/conf/certs/localhost.crt"
    SSLCertificateKeyFile "/usr/local/apache2/conf/certs/localhost.key"

    ProxyPreserveHost On
    ProxyPass        /api http://api:4000/api
    ProxyPassReverse /api http://api:4000/api
</VirtualHost>
